[server]
host = "127.0.0.1"
port = 8767
open_browser_on_start = true

[engine]
poll_interval_seconds = 2.0
max_trade_age_seconds = 900
paper_initial_equity = 10000.0
auto_start = true
keep_awake = true

[telegram]
enabled = false
bot_token = ""
chat_id = ""
allowed_chat_ids = []
send_trade_alerts = true
chat_enabled = true
poll_interval_seconds = 5.0
long_poll_timeout_seconds = 10

[market_data]
# websocket is the production path. rest is only for diagnostics.
mode = "websocket"
market = "um_futures"
rest_base_url = "https://fapi.binance.com"
ws_host = "fstream.binance.com"
ws_port = 443
real_data_only = true
stale_after_seconds = 5.0
snapshot_limit = 1000
trade_buffer_size = 300
book_levels_for_heatmap = 100
price_bucket_size.BTCUSDT = 100.0
price_bucket_size.ETHUSDT = 10.0
price_bucket_size.XAUUSDT = 5.0

[open_interest]
enabled = true
poll_interval_seconds = 15
history_size = 20
min_change_pct = 0.03

[liquidity_memory]
enabled = true
sample_interval_seconds = 2
retention_minutes = 180
ema_alpha = 0.18
min_bucket_notional.BTCUSDT = 250000.0
min_bucket_notional.ETHUSDT = 100000.0
min_bucket_notional.XAUUSDT = 50000.0
target_memory_weight = 0.35
pull_warning_decay_seconds = 120

[historical_liquidity]
enabled = true
years = 2
interval = "1m"
decay_half_life_days = 30
weight = 0.30
max_levels_each_side = 12
derived_intervals = ["1m", "5m", "15m", "30m", "1h"]
update_on_startup = true
update_while_running = true
live_rebuild_levels = false
startup_recent_limit = 1500
level_rebuild_interval_minutes = 60
raw_m1_retention_days = 60
prune_interval_days = 30
prune_raw_m1_while_running = true
incremental_level_window_days = 7
request_sleep_seconds = 0.05
binance_symbols = ["BTCUSDT", "ETHUSDT", "XAUUSDT"]
mt5_fallback_symbols = []

[major_liquidity]
enabled = true
min_zone_score = 65.0
max_zones_each_side = 8
merge_distance_bps.BTCUSDT = 10.0
merge_distance_bps.ETHUSDT = 10.0
merge_distance_bps.XAUUSDT = 6.0
min_book_notional.BTCUSDT = 250000.0
min_book_notional.ETHUSDT = 100000.0
min_book_notional.XAUUSDT = 50000.0
profile_strength_min = 75.0
vwap_zone_score = 62.0
swing_zone_score = 68.0

[vwap]
source = "binance_klines_plus_live"
anchor = "utc_day"
interval = "1m"
reconcile_seconds = 60
backfill_limit = 1500

[execution]
# mt5_demo or mt5_live. paper is intentionally not used by default. paper/hybrid/mt5_live
mode = "paper"
allow_live_orders = true
magic_number = 260618
deviation_points = 30
comment = "TradingAgent"

[watchdog]
enabled = false
market_stale_seconds = 30.0
market_restart_cooldown_seconds = 30.0
mt5_check_interval_seconds = 30.0
mt5_failure_threshold = 3
block_live_entries_on_mt5_failure = true
mt5_restart_enabled = true
mt5_restart_interval_seconds = 120.0
mt5_restart_backoff_multiplier = 2.0
mt5_restart_max_interval_seconds = 90000.0
mt5_failure_notify_interval_seconds = 120.0
# Set this to your MT5 terminal64.exe path to let watchdog relaunch MT5.
mt5_terminal_path = 'C:\Users\akpatil\AppData\Roaming\MetaQuotes\Terminal\D0E8209F77C8CF37AD8BF550E51FF075'
telegram_alerts = true
alert_cooldown_seconds = 300.0

[risk]
risk_per_trade_pct = 0.5
sizing_account_balance = 10000.0
max_daily_loss_pct = 100
max_total_open_risk_pct = 10.0
max_open_positions = 6
max_open_positions_per_symbol = 1
max_consecutive_losses = 30
min_rr = 2.0
